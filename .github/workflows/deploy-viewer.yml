name: Deploy viewer

# Builds the static viewer and deploys it to Cloudflare Pages on every push to
# main. Set two repository secrets once and this runs untouched forever:
#   CLOUDFLARE_API_TOKEN   (a token with the "Cloudflare Pages: Edit" permission)
#   CLOUDFLARE_ACCOUNT_ID
# The Pages project is named "muonet" (see wrangler.toml).

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - ".github/workflows/deploy-viewer.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to enable deploys."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        if: steps.creds.outputs.ready == 'true'
      - run: npm run build
        if: steps.creds.outputs.ready == 'true'
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: viewer
          command: pages deploy out --project-name muonet --branch main
