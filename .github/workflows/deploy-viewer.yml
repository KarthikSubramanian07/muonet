name: Deploy viewer

# Builds the static viewer and deploys it to Cloudflare Pages on every push to
# main. Set two repository secrets once and this runs untouched forever:
#   CLOUDFLARE_API_TOKEN   (a token with the "Cloudflare Pages: Edit" permission)
#   CLOUDFLARE_ACCOUNT_ID
# The Pages project is named "muonet" (see wrangler.toml).

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - ".github/workflows/deploy-viewer.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: viewer
          command: pages deploy out --project-name muonet --branch main
