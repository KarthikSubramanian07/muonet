[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muonet"
version = "0.1.0"
description = "Cosmic rays in, 3D interiors out. A reproducible, detector-realistic muon scattering tomography toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karthik Subramanian" }]
keywords = [
    "muon-tomography",
    "muography",
    "cosmic-rays",
    "tomography",
    "reconstruction",
    "physics",
    "machine-learning",
    "nuclear-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Pinned in uv.lock for exact reproduction. Constraints here stay wide enough
# to install cleanly on a laptop, a free Colab T4, or CI.
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.2,<3",
    "pyyaml>=6.0,<7",
    "tqdm>=4.64,<5",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/KarthikSubramanian07/muonet"
Repository = "https://github.com/KarthikSubramanian07/muonet"
Issues = "https://github.com/KarthikSubramanian07/muonet/issues"

[project.scripts]
muonet = "muonet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["muonet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
