# A fully custom scene, described inline. This is how you point Muonet at your
# own geometry without writing any Python: list primitives painted onto a
# background, later ones overwriting earlier ones.
#
#   muonet recon --config configs/custom_scene.yaml --method poca
scene:
  background: air
  primitives:
    # A light aluminum shipping container...
    - shape: box
      material: aluminum
      center_cm: [0, 0, 0]
      size_cm: [22, 18, 14]
    # ...concealing a small dense core and a lead slab.
    - shape: sphere
      material: tungsten
      center_cm: [-5, 0, 2]
      radius_cm: 3.0
    - shape: box
      material: lead
      center_cm: [6, 0, -2]
      size_cm: [4, 8, 5]
detector: realistic_sipm
dosage: 4096
seed: 0
grid_shape: [32, 32, 32]
grid_size_cm: [32.0, 32.0, 32.0]
